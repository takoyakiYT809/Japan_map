<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>日本地図ぬりえツール</title>
<style>
  body {
    font-family: "Segoe UI", sans-serif;
    background: #eef0f4;
    margin: 0;
    padding: 20px;
  }

  h1 {
    text-align: center;
    margin-bottom: 20px;
    font-weight: 600;
  }

  #panel {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
    margin-bottom: 20px;
  }

  .btn {
    padding: 10px 16px;
    border-radius: 8px;
    border: none;
    background: #4a6cf7;
    color: white;
    cursor: pointer;
    font-size: 14px;
    transition: 0.2s;
  }
  .btn:hover {
    background: #3a57c9;
  }

  .toggle-btn {
    background: #555;
  }
  .toggle-btn.active {
    background: #2ecc71;
  }

  #colorPicker, #bgColorPicker {
    padding: 6px;
    border-radius: 6px;
    border: 1px solid #ccc;
    cursor: pointer;
  }

  #map {
    width: 900px;
    max-width: 100%;
    margin: 0 auto;
    background: white;
    border-radius: 12px;
    padding: 10px;
    box-shadow: 0 0 12px rgba(0,0,0,0.15);
  }

  #map svg {
    width: 100%;
    height: auto;
  }

  .prefecture {
    cursor: pointer;
    transition: 0.15s;
  }
  .prefecture:hover {
    opacity: 0.7;
  }

  .label {
    font-size: 12px;
    pointer-events: none;
    fill: #333;
  }
</style>
</head>
<body>

<h1>日本地図ぬりえツール</h1>

<div id="panel">
  <label>塗る色：<input type="color" id="colorPicker" value="#ff0000"></label>
  <label>背景色：<input type="color" id="bgColorPicker" value="#ffffff"></label>

  <button class="btn" id="fillAllBtn">全部塗りつぶし</button>
  <button class="btn" id="resetBtn">リセット</button>
  <button class="btn toggle-btn" id="labelToggleBtn">県名 ON/OFF</button>
  <button class="btn" id="saveBtn">画像保存（PNG）</button>
</div>

<div id="map">読み込み中...</div>

<script>
const MAP_SVG_PATH = "map-full.svg";

window.addEventListener("DOMContentLoaded", async () => {
  const container = document.getElementById("map");

  // SVG読み込み
  const res = await fetch(MAP_SVG_PATH);
  const svgText = await res.text();
  container.innerHTML = svgText;

  const svg = container.querySelector("svg");
  const prefs = container.querySelectorAll(".prefecture");

  const colorInput = document.getElementById("colorPicker");
  const bgColorInput = document.getElementById("bgColorPicker");

  // ★ 県名テキストを自動生成して追加
  prefs.forEach(pref => {
    const titleEl = pref.querySelector("title");
    if (!titleEl) return;

    // 「沖縄 / Okinawa」→「沖縄」
    const raw = titleEl.textContent.trim();
    const jp = raw.split("/")[0].trim();

    // 形の中心座標を計算
    const bbox = pref.getBBox();
    const cx = bbox.x + bbox.width / 2;
    const cy = bbox.y + bbox.height / 2;

    const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
    text.setAttribute("class", "label");
    text.setAttribute("x", cx);
    text.setAttribute("y", cy);
    text.setAttribute("text-anchor", "middle");
    text.setAttribute("dominant-baseline", "middle");
    text.textContent = jp;

    pref.appendChild(text);
  });

  const labels = container.querySelectorAll(".label");

  // 背景色（見た目だけ）
  bgColorInput.addEventListener("input", () => {
    container.style.background = bgColorInput.value;
  });

  // クリックで塗る／同じ色なら消す
  prefs.forEach(pref => {
    pref.addEventListener("click", e => {
      const current = e.currentTarget;
      const selectedColor = colorInput.value;

      if (current.style.fill === selectedColor) {
        current.style.fill = ""; // 色を消す
      } else {
        current.style.fill = selectedColor;
      }
    });
  });

  // 県名 ON/OFF
  const labelBtn = document.getElementById("labelToggleBtn");
  let labelVisible = true;
  labelBtn.addEventListener("click", () => {
    labelVisible = !labelVisible;
    labels.forEach(l => {
      l.style.display = labelVisible ? "block" : "none";
    });
    labelBtn.classList.toggle("active");
  });

  // 全部塗りつぶし
  document.getElementById("fillAllBtn").addEventListener("click", () => {
    const c = colorInput.value;
    prefs.forEach(p => p.style.fill = c);
  });

  // リセット
  document.getElementById("resetBtn").addEventListener("click", () => {
    prefs.forEach(p => p.style.fill = "");
    container.style.background = "#ffffff";
    bgColorInput.value = "#ffffff";
  });

  // PNG保存（背景透過）
  document.getElementById("saveBtn").addEventListener("click", () => {
    const serializer = new XMLSerializer();
    const svgStr = serializer.serializeToString(svg);

    const svgBlob = new Blob([svgStr], { type: "image/svg+xml;charset=utf-8" });
    const url = URL.createObjectURL(svgBlob);

    const img = new Image();
    img.onload = () => {
      const vb = svg.viewBox.baseVal;
      const canvas = document.createElement("canvas");
      canvas.width = vb.width;
      canvas.height = vb.height;

      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0); // 透過背景のまま描画

      URL.revokeObjectURL(url);

      const pngUrl = canvas.toDataURL("image/png");
      const a = document.createElement("a");
      a.href = pngUrl;
      a.download = "japan-map.png";
      a.click();
    };

    img.src = url;
  });
});
</script>

</body>
</html>
