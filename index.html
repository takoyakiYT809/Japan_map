<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日本地図＆京都府 ぬりえ</title>
  <style>
    :root {
      --bg-main: #111827;
      --panel-bg: #1f2937;
      --border-color: #374151;
      --text: #f9fafb;
      --text-sub: #9ca3af;
      --accent: #3b82f6;
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background-color: var(--bg-main);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 上部操作パネル */
    header {
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      z-index: 10;
    }

    .group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .label {
      font-size: 12px;
      color: var(--text-sub);
      font-weight: 600;
    }

    /* 切り替えタブ */
    .tab-container {
      display: flex;
      background: var(--bg-main);
      padding: 3px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .tab-btn {
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      background: transparent;
      color: var(--text-sub);
      cursor: pointer;
      border-radius: 6px;
      transition: 0.15s;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #fff;
    }

    /* パレット */
    .palette {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .color-dot {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .color-dot:hover {
      transform: scale(1.15);
    }

    .color-dot.selected {
      border-color: #fff;
      transform: scale(1.2);
      box-shadow: 0 0 0 2px var(--accent);
    }

    .picker {
      width: 28px;
      height: 28px;
      border: none;
      background: none;
      cursor: pointer;
    }

    /* ボタン類 */
    .btn {
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: #374151;
      color: var(--text);
      cursor: pointer;
      transition: 0.15s;
    }

    .btn:hover {
      background: #4b5563;
    }

    .btn-save {
      background: #10b981;
      border-color: #059669;
    }

    .btn-save:hover {
      background: #059669;
    }

    /* 描画エリア */
    main {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #map-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background-color 0.2s;
    }

    svg {
      width: 90%;
      height: 90%;
      max-width: 900px;
      max-height: 700px;
    }

    /* ホバー時のCSS干渉を防止 */
    svg path, svg polygon, svg rect, svg circle, svg g {
      cursor: pointer;
      transition: opacity 0.15s;
    }

    svg path:hover, svg polygon:hover, svg rect:hover, svg circle:hover {
      opacity: 0.75 !important;
    }

    /* ツールチップ */
    #tooltip {
      position: absolute;
      display: none;
      background: rgba(17, 24, 39, 0.9);
      color: #fff;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
      pointer-events: none;
      z-index: 100;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

  <header>
    <div class="group">
      <div class="tab-container">
        <button class="tab-btn active" onclick="switchMap('japan')">日本全国</button>
        <button class="tab-btn" onclick="switchMap('kyoto')">京都府詳細</button>
      </div>
    </div>

    <div class="group">
      <span class="label">塗り色:</span>
      <div class="palette">
        <div class="color-dot selected" style="background-color: #ef4444;" onclick="selectPaintColor('#ef4444', this)"></div>
        <div class="color-dot" style="background-color: #f59e0b;" onclick="selectPaintColor('#f59e0b', this)"></div>
        <div class="color-dot" style="background-color: #10b981;" onclick="selectPaintColor('#10b981', this)"></div>
        <div class="color-dot" style="background-color: #3b82f6;" onclick="selectPaintColor('#3b82f6', this)"></div>
        <div class="color-dot" style="background-color: #8b5cf6;" onclick="selectPaintColor('#8b5cf6', this)"></div>
        <input type="color" class="picker" value="#ef4444" onchange="selectPaintColor(this.value, null)">
      </div>
    </div>

    <div class="group">
      <span class="label">背景:</span>
      <div class="palette">
        <div class="color-dot" style="background-color: #ffffff;" onclick="setCanvasBg('#ffffff')"></div>
        <div class="color-dot" style="background-color: #f3f4f6;" onclick="setCanvasBg('#f3f4f6')"></div>
        <div class="color-dot" style="background-color: #111827;" onclick="setCanvasBg('#111827')"></div>
      </div>
    </div>

    <div class="group">
      <label style="font-size:12px; cursor:pointer;">
        <input type="checkbox" id="transparent-bg"> 透過背景
      </label>
      <button class="btn" onclick="resetMapColors()">全消去</button>
      <button class="btn btn-save" onclick="saveAsImage()">PNG保存</button>
    </div>
  </header>

  <main>
    <div id="map-wrapper">
      <!-- SVGデータが入ります -->
    </div>
  </main>

  <div id="tooltip"></div>

  <script>
    let currentColor = '#ef4444';
    let currentMapMode = 'japan';

    const kyotoCityMap = {
      "JP26101": "京都市北区", "JP26102": "京都市上京区", "JP26103": "京都市左京区",
      "JP26104": "京都市中京区", "JP26105": "京都市東山区", "JP26106": "京都市下京区",
      "JP26107": "京都市南区", "JP26108": "京都市右京区", "JP26109": "京都市伏見区",
      "JP26110": "京都市山科区", "JP26111": "京都市西京区", "JP26201": "福知山市",
      "JP26202": "舞鶴市", "JP26203": "綾部市", "JP26204": "宇治市",
      "JP26205": "宮津市", "JP26206": "城陽市", "JP26207": "向日市",
      "JP26208": "長岡京市", "JP26209": "八幡市", "JP26210": "京田辺市",
      "JP26211": "京丹後市", "JP26212": "南丹市", "JP26213": "木津川市",
      "JP26214": "大山崎町", "JP26303": "久御山町", "JP26322": "井手町",
      "JP26343": "宇治田原町", "JP26364": "笠置町", "JP26365": "和束町",
      "JP26366": "精華町", "JP26367": "南山城村", "JP26407": "京丹波町",
      "JP26463": "伊根町", "JP26465": "与謝野町"
    };

    const wrapper = document.getElementById('map-wrapper');
    const tooltip = document.getElementById('tooltip');

    function selectPaintColor(color, el) {
      currentColor = color;
      document.querySelectorAll('.palette .color-dot').forEach(btn => btn.classList.remove('selected'));
      if (el) el.classList.add('selected');
    }

    function setCanvasBg(color) {
      wrapper.style.backgroundColor = color;
    }

    function switchMap(mode) {
      currentMapMode = mode;
      const btns = document.querySelectorAll('.tab-btn');
      btns.forEach(btn => btn.classList.remove('active'));
      if (mode === 'japan') btns[0].classList.add('active');
      if (mode === 'kyoto') btns[1].classList.add('active');

      const fileName = (mode === 'japan') ? 'japan-map.svg' : 'kyoto-map.svg';

      fetch(fileName)
        .then(res => res.text())
        .then(svgText => {
          wrapper.innerHTML = svgText;
          setupEvents();
        })
        .catch(() => {
          wrapper.innerHTML = `<p style="color:#ef4444;">${fileName} の読み込みに失敗しました。</p>`;
        });
    }

    function setupEvents() {
      const svg = wrapper.querySelector('svg');
      if (!svg) return;

      const elements = svg.querySelectorAll('path, polygon, rect, circle');

      elements.forEach(el => {
        const parentG = el.closest('g');
        const entityId = (parentG && parentG.id) ? parentG.id : (el.id || el.getAttribute('data-code'));

        // 名前探索の強化（あらゆる属性から取得）
        let regionName = el.getAttribute('name') || el.getAttribute('title') || el.getAttribute('data-name') ||
                         (parentG ? (parentG.getAttribute('name') || parentG.getAttribute('title') || parentG.getAttribute('class')) : null);
        
        if (currentMapMode === 'kyoto' && entityId) {
          if (kyotoCityMap[entityId]) regionName = kyotoCityMap[entityId];
        }

        // クリック時：トグル消去（塗り直し＆同じ色をクリックで消去）
        el.addEventListener('click', (e) => {
          e.stopPropagation();

          // 現在の要素またはグループのスタイル取得
          const currentFill = el.style.fill || el.getAttribute('fill');
          
          // 同じ色ならクリア（消去）、違う色なら着色
          const targetColor = (currentFill === currentColor) ? '' : currentColor;

          if (entityId) {
            const sameGroup = svg.querySelectorAll(`[id="${entityId}"], [data-code="${entityId}"], g[id="${entityId}"] path`);
            if (sameGroup.length > 0) {
              sameGroup.forEach(target => applyColor(target, targetColor));
              return;
            }
          }
          applyColor(el, targetColor);
        });

        // ホバーツールチップ
        if (regionName) {
          el.addEventListener('mouseenter', () => {
            tooltip.innerText = regionName;
            tooltip.style.display = 'block';
          });
          el.addEventListener('mousemove', (e) => {
            tooltip.style.left = (e.pageX + 12) + 'px';
            tooltip.style.top = (e.pageY + 12) + 'px';
          });
          el.addEventListener('mouseleave', () => {
            tooltip.style.display = 'none';
          });
        }
      });
    }

    function applyColor(element, color) {
      if (!color) {
        element.style.fill = '';
        element.removeAttribute('fill');
      } else {
        element.style.fill = color;
        element.setAttribute('fill', color);
      }
    }

    function resetMapColors() {
      const svg = wrapper.querySelector('svg');
      if (!svg) return;
      svg.querySelectorAll('path, polygon, rect, circle').forEach(el => {
        el.style.fill = '';
        el.removeAttribute('fill');
      });
    }

    function saveAsImage() {
      const svg = wrapper.querySelector('svg');
      if (!svg) return;

      const isTransparent = document.getElementById('transparent-bg').checked;
      const svgData = new XMLSerializer().serializeToString(svg);
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      const img = new Image();

      const viewBox = svg.viewBox.baseVal;
      const width = viewBox.width || svg.clientWidth || 800;
      const height = viewBox.height || svg.clientHeight || 600;

      canvas.width = width * 2;
      canvas.height = height * 2;

      const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(svgBlob);

      img.onload = () => {
        if (!isTransparent) {
          ctx.fillStyle = wrapper.style.backgroundColor || '#ffffff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);

        const a = document.createElement('a');
        a.download = `${currentMapMode}_ぬりえ.png`;
        a.href = canvas.toDataURL('image/png');
        a.click();
      };

      img.src = url;
    }

    switchMap('japan');
  </script>
</body>
</html>
