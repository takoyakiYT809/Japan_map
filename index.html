<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>都道府県・市区町村 ぬりえ Studio Pro</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap');

    :root {
      --bg-dark: #0b0f19;
      --card-bg: rgba(23, 32, 51, 0.75);
      --border: rgba(255, 255, 255, 0.1);
      --border-hover: rgba(56, 189, 248, 0.5);
      --text: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #38bdf8;
      --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic UI", sans-serif;
      margin: 0;
      padding: 0;
      background-color: var(--bg-dark);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .screen {
      display: none;
      width: 100%;
      height: 100%;
      flex-direction: column;
    }

    .screen.active {
      display: flex;
    }

    /* ホーム ＆ 地図選択画面 */
    .home-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
      background: 
        radial-gradient(circle at 50% 20%, rgba(56, 189, 248, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(129, 140, 248, 0.1) 0%, transparent 50%),
        #0b0f19;
    }

    .brand-badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 20px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      margin-bottom: 16px;
      text-transform: uppercase;
    }

    .home-title {
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin: 0 0 12px 0;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .home-subtitle {
      color: var(--text-sub);
      font-size: 15px;
      max-width: 500px;
      line-height: 1.6;
      margin-bottom: 40px;
    }

    .map-grid {
      display: flex;
      flex-direction: column;
      gap: 24px;
      width: 100%;
      max-width: 640px;
    }

    .category-group {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      text-align: left;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    .category-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 1.2px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 12px;
    }

    .map-card {
      background: rgba(255, 255, 255, 0.03);
      padding: 16px 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      font-size: 15px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .map-card:hover {
      border-color: var(--border-hover);
      background: rgba(56, 189, 248, 0.08);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(56, 189, 248, 0.15);
    }

    .map-card-arrow {
      color: var(--text-sub);
      transition: transform 0.2s, color 0.2s;
    }

    .map-card:hover .map-card-arrow {
      color: var(--accent);
      transform: translateX(4px);
    }

    /* ぬりえメイン画面 */
    header {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .back-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      transition: all 0.2s;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: var(--text-sub);
    }

    .current-map-title {
      font-weight: 800;
      font-size: 17px;
      letter-spacing: -0.3px;
    }

    .controls-bar {
      display: flex;
      align-items: center;
      gap: 20px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 10px 22px;
      border-radius: 50px;
      border: 1px solid var(--border);
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .control-label {
      font-size: 11px;
      color: var(--text-sub);
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .palette {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .color-btn {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.2);
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }

    .color-btn:hover {
      transform: scale(1.18);
    }

    .color-btn.selected {
      border-color: #ffffff;
      transform: scale(1.25);
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.6);
    }

    .picker {
      width: 28px;
      height: 28px;
      border: none;
      background: none;
      cursor: pointer;
      border-radius: 50%;
    }

    .btn {
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .btn-save {
      background: #10b981;
      border-color: #10b981;
      color: #000;
    }

    .btn-save:hover {
      background: #34d399;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
    }

    main {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    #map-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #0b0f19;
      transition: background-color 0.3s ease;
    }

    svg {
      width: 85%;
      height: 85%;
      max-width: 950px;
      max-height: 720px;
    }

    svg path, svg polygon, svg rect, svg circle {
      cursor: pointer;
      transition: opacity 0.15s ease, fill 0.2s ease;
      stroke: #64748b;
      stroke-width: 0.5;
    }

    svg path:hover, svg polygon:hover, svg rect:hover, svg circle:hover {
      opacity: 0.8 !important;
    }

    /* ツールチップ（残留バグ徹底ガード） */
    #tooltip {
      position: fixed;
      display: none;
      opacity: 0;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(8px);
      color: #ffffff;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      pointer-events: none;
      z-index: 9999;
      border: 1px solid var(--border);
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
      transition: opacity 0.1s ease;
    }
  </style>
</head>
<body>

  <!-- 画面1: ホーム＆地図選択 -->
  <div id="screen-home" class="screen active">
    <div class="home-container">
      <div class="brand-badge">Map Coloring Studio</div>
      <h1 class="home-title">都道府県・市区町村 ぬりえ</h1>
      <p class="home-subtitle">色を選んでクリックするだけで、美しいグラフィック地図を作成・保存できます。</p>

      <div class="map-grid">
        <div class="category-group">
          <div class="category-title">🗺️ 全国エリア</div>
          <div class="card-list">
            <div class="map-card" onclick="startApp('japan', '日本全国（47都道府県）')">
              <span>日本全国 (47都道府県)</span>
              <span class="map-card-arrow">→</span>
            </div>
          </div>
        </div>

        <div class="category-group">
          <div class="category-title">📍 近畿エリア</div>
          <div class="card-list">
            <div class="map-card" onclick="startApp('kyoto', '京都府（全市区町村）')">
              <span>京都府 (全市区町村)</span>
              <span class="map-card-arrow">→</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 画面2: ぬりえキャンバス -->
  <div id="screen-app" class="screen">
    <header>
      <div class="header-left">
        <button class="back-btn" onclick="goHome()">← 地図選択に戻る</button>
        <div class="current-map-title" id="display-map-title">日本全国</div>
      </div>
      <div>
        <label style="font-size: 12px; cursor: pointer; color: var(--text-sub); margin-right: 14px; font-weight:600;">
          <input type="checkbox" id="transparent-bg"> 透過PNG保存
        </label>
        <button class="btn" onclick="resetMapColors()">色をクリア</button>
        <button class="btn btn-save" onclick="saveAsImage()">PNG保存</button>
      </div>
    </header>

    <main>
      <div id="map-wrapper"></div>

      <div class="controls-bar">
        <div class="control-group">
          <span class="control-label">Paint</span>
          <div class="palette">
            <div class="color-btn selected" style="background-color: #ef4444;" onclick="selectPaintColor('#ef4444', this)"></div>
            <div class="color-btn" style="background-color: #f59e0b;" onclick="selectPaintColor('#f59e0b', this)"></div>
            <div class="color-btn" style="background-color: #10b981;" onclick="selectPaintColor('#10b981', this)"></div>
            <div class="color-btn" style="background-color: #3b82f6;" onclick="selectPaintColor('#3b82f6', this)"></div>
            <div class="color-btn" style="background-color: #8b5cf6;" onclick="selectPaintColor('#8b5cf6', this)"></div>
            <div class="color-btn" style="background-color: #ec4899;" onclick="selectPaintColor('#ec4899', this)"></div>
            <input type="color" class="picker" value="#ef4444" onchange="selectPaintColor(this.value, null)" title="自由選択">
          </div>
        </div>

        <div style="width: 1px; height: 22px; background: var(--border);"></div>

        <div class="control-group">
          <span class="control-label">Canvas Bg</span>
          <div class="palette">
            <div class="color-btn" style="background-color: #0b0f19;" onclick="setCanvasBg('#0b0f19')"></div>
            <div class="color-btn" style="background-color: #ffffff;" onclick="setCanvasBg('#ffffff')"></div>
            <div class="color-btn" style="background-color: #f1f5f9;" onclick="setCanvasBg('#f1f5f9')"></div>
            <div class="color-btn" style="background-color: #0f172a;" onclick="setCanvasBg('#0f172a')"></div>
            <input type="color" class="picker" value="#0b0f19" onchange="setCanvasBg(this.value)" title="自由選択">
          </div>
        </div>
      </div>
    </main>
  </div>

  <div id="tooltip"></div>

  <script>
    let currentColor = '#ef4444';
    let currentMapMode = 'japan';

    const japanPrefMap = {
      "Hokkaido": "北海道", "Aomori": "青森県", "Iwate": "岩手県", "Miyagi": "宮城県",
      "Akita": "秋田県", "Yamagata": "山形県", "Fukushima": "福島県", "Ibaraki": "茨城県",
      "Tochigi": "栃木県", "Gunma": "群馬県", "Saitama": "埼玉県", "Chiba": "千葉県",
      "Tokyo": "東京都", "Kanagawa": "神奈川県", "Niigata": "新潟県", "Toyama": "富山県",
      "Ishikawa": "石川県", "Fukui": "福井県", "Yamanashi": "山梨県", "Nagano": "長野県",
      "Gifu": "岐阜県", "Shizuoka": "静岡県", "Aichi": "愛知県", "Mie": "三重県",
      "Shiga": "滋賀県", "Kyoto": "京都府", "Osaka": "大阪府", "Hyogo": "兵庫県",
      "Nara": "奈良県", "Wakayama": "和歌山県", "Tottori": "鳥取県", "Shimane": "島根県",
      "Okayama": "岡山県", "Hiroshima": "広島県", "Yamaguchi": "山口県", "Tokushima": "徳島県",
      "Kagawa": "香川県", "Ehime": "愛媛県", "Kochi": "高知県", "Fukuoka": "福岡県",
      "Saga": "佐賀県", "Nagasaki": "長崎県", "Kumamoto": "熊本県", "Oita": "大分県",
      "Miyazaki": "宮崎県", "Kagoshima": "鹿児島県", "Okinawa": "沖縄県"
    };

    const kyotoCityMap = {
      "JP26101": "京都市北区", "JP26102": "京都市上京区", "JP26103": "京都市左京区",
      "JP26104": "京都市中京区", "JP26105": "京都市東山区", "JP26106": "京都市下京区",
      "JP26107": "京都市南区", "JP26108": "京都市右京区", "JP26109": "京都市伏見区",
      "JP26110": "京都市山科区", "JP26111": "京都市西京区", "JP26201": "福知山市",
      "JP26202": "舞鶴市", "JP26203": "綾部市", "JP26204": "宇治市",
      "JP26205": "宮津市", "JP26206": "城陽市", "JP26207": "向日市",
      "JP26208": "長岡京市", "JP26209": "八幡市", "JP26210": "京田辺市",
      "JP26211": "京丹後市", "JP26212": "南丹市", "JP26213": "木津川市",
      "JP26214": "大山崎町", "JP26303": "久御山町", "JP26322": "井手町",
      "JP26343": "宇治田原町", "JP26364": "笠置町", "JP26365": "和束町",
      "JP26366": "精華町", "JP26367": "南山城村", "JP26407": "京丹波町",
      "JP26463": "伊根町", "JP26465": "与謝野町"
    };

    const wrapper = document.getElementById('map-wrapper');
    const tooltip = document.getElementById('tooltip');

    // ツールチップ消去ガード
    function hideTooltip() {
      tooltip.style.opacity = '0';
      tooltip.style.display = 'none';
      tooltip.innerText = '';
    }

    // 全体イベントリスナーでツールチップの残留を防止
    window.addEventListener('mouseup', hideTooltip);

    function startApp(mode, title) {
      hideTooltip();
      currentMapMode = mode;
      document.getElementById('display-map-title').innerText = title;
      document.getElementById('screen-home').classList.remove('active');
      document.getElementById('screen-app').classList.add('active');
      loadMapSvg(mode);
    }

    function goHome() {
      hideTooltip();
      document.getElementById('screen-app').classList.remove('active');
      document.getElementById('screen-home').classList.add('active');
    }

    function selectPaintColor(color, el) {
      currentColor = color;
      document.querySelectorAll('.controls-bar .control-group:first-child .color-btn').forEach(btn => btn.classList.remove('selected'));
      if (el) el.classList.add('selected');
    }

    function setCanvasBg(color) {
      wrapper.style.backgroundColor = color;
    }

    function loadMapSvg(mode) {
      const fileName = (mode === 'japan') ? 'japan-map.svg' : 'kyoto-map.svg';

      fetch(fileName)
        .then(res => res.text())
        .then(svgText => {
          wrapper.innerHTML = svgText;
          setupMapEvents();
        })
        .catch(() => {
          wrapper.innerHTML = `<p style="color:#ef4444;">${fileName} の読み込みに失敗しました。</p>`;
        });
    }

    function setupMapEvents() {
      const svg = wrapper.querySelector('svg');
      if (!svg) return;

      const elements = svg.querySelectorAll('path, polygon, rect, circle');

      elements.forEach(el => {
        const parentG = el.closest('g');
        const groupId = (parentG && parentG.id) ? parentG.id : (el.id || el.getAttribute('data-code'));

        let rawName = el.getAttribute('name') || el.getAttribute('title') || el.getAttribute('data-name') ||
                      (parentG ? (parentG.getAttribute('name') || parentG.getAttribute('title') || parentG.getAttribute('id')) : null);

        let regionName = rawName;

        if (currentMapMode === 'japan' && rawName) {
          const cleanName = rawName.split('/')[0].trim();
          regionName = japanPrefMap[cleanName] || japanPrefMap[rawName] || rawName;
        }

        if (currentMapMode === 'kyoto') {
          if (groupId && kyotoCityMap[groupId]) {
            regionName = kyotoCityMap[groupId];
          } else if (rawName && kyotoCityMap[rawName]) {
            regionName = kyotoCityMap[rawName];
          }
        }

        // SVGごとの「最初の塗り色」をデータ属性に保存（色消し時の正確な復元用）
        const computedStyle = window.getComputedStyle(el);
        const originalFill = el.getAttribute('fill') || computedStyle.fill || '#cbd5e1';
        el.setAttribute('data-default-fill', originalFill);

        // クリック時処理
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          hideTooltip();

          const isPainted = el.getAttribute('data-painted') === 'true';
          const currentPaintedColor = el.getAttribute('data-color');
          
          // 同じ色なら消去（＝最初の色へ復元）、違う色なら塗る
          const nextColor = (isPainted && currentPaintedColor === currentColor) ? null : currentColor;

          if (groupId) {
            const sameGroup = svg.querySelectorAll(`[id="${groupId}"], [data-code="${groupId}"], g[id="${groupId}"] path`);
            if (sameGroup.length > 0) {
              sameGroup.forEach(target => applyColor(target, nextColor));
              return;
            }
          }
          applyColor(el, nextColor);
        });

        // ホバーツールチップ処理
        if (regionName) {
          el.addEventListener('mouseenter', (e) => {
            tooltip.innerText = regionName;
            tooltip.style.display = 'block';
            tooltip.style.opacity = '1';
            tooltip.style.left = (e.clientX + 14) + 'px';
            tooltip.style.top = (e.clientY + 14) + 'px';
          });
          
          el.addEventListener('mousemove', (e) => {
            tooltip.style.left = (e.clientX + 14) + 'px';
            tooltip.style.top = (e.clientY + 14) + 'px';
          });
          
          el.addEventListener('mouseleave', hideTooltip);
        }
      });
    }

    // 色適用処理（nullの場合は「SVG本来の初期色」に戻す）
    function applyColor(element, color) {
      if (!color) {
        const defaultColor = element.getAttribute('data-default-fill') || '#cbd5e1';
        element.style.fill = defaultColor;
        element.setAttribute('fill', defaultColor);
        element.removeAttribute('data-painted');
        element.removeAttribute('data-color');
      } else {
        element.style.fill = color;
        element.setAttribute('fill', color);
        element.setAttribute('data-painted', 'true');
        element.setAttribute('data-color', color);
      }
    }

    function resetMapColors() {
      hideTooltip();
      const svg = wrapper.querySelector('svg');
      if (!svg) return;
      svg.querySelectorAll('path, polygon, rect, circle').forEach(el => {
        applyColor(el, null);
      });
    }

    function saveAsImage() {
      hideTooltip();
      const svg = wrapper.querySelector('svg');
      if (!svg) return;

      const isTransparent = document.getElementById('transparent-bg').checked;
      const svgData = new XMLSerializer().serializeToString(svg);
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      const img = new Image();

      const viewBox = svg.viewBox.baseVal;
      const width = viewBox.width || svg.clientWidth || 800;
      const height = viewBox.height || svg.clientHeight || 600;

      canvas.width = width * 2;
      canvas.height = height * 2;

      const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(svgBlob);

      img.onload = () => {
        if (!isTransparent) {
          ctx.fillStyle = wrapper.style.backgroundColor || '#0b0f19';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);

        const a = document.createElement('a');
        a.download = `${currentMapMode}_塗り絵.png`;
        a.href = canvas.toDataURL('image/png');
        a.click();
      };

      img.src = url;
    }
  </script>
</body>
</html>
