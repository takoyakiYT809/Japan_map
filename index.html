<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>都道府県・市区町村 ぬりえツール</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --map-default-fill: #e2e8f0; /* 初期色の灰色 */
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background-color: var(--bg-dark);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 画面切り替え管理 */
    .screen {
      display: none;
      width: 100%;
      height: 100%;
      flex-direction: column;
    }

    .screen.active {
      display: flex;
    }

    /* ----------------------------------
       1. ホーム ＆ 地図選択画面 
    ---------------------------------- */
    .home-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
    }

    .home-title {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .home-subtitle {
      color: var(--text-sub);
      font-size: 15px;
      margin-bottom: 35px;
    }

    /* 地図選択カードエリア */
    .map-grid {
      display: flex;
      flex-direction: column;
      gap: 24px;
      width: 100%;
      max-width: 650px;
    }

    .category-group {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      text-align: left;
    }

    .category-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }

    .map-card {
      background: #334155;
      padding: 14px 18px;
      border-radius: 8px;
      border: 1px solid transparent;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.2s;
    }

    .map-card:hover {
      border-color: var(--accent);
      background: #475569;
      transform: translateY(-2px);
    }

    /* ----------------------------------
       2. ぬりえメイン画面 
    ---------------------------------- */
    header {
      background: #1e293b;
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .back-btn {
      background: #334155;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }

    .back-btn:hover {
      background: #475569;
    }

    .current-map-title {
      font-weight: 700;
      font-size: 16px;
    }

    /* パレット＆コントローラー */
    .controls-bar {
      display: flex;
      align-items: center;
      gap: 20px;
      background: rgba(15, 23, 42, 0.9);
      padding: 10px 20px;
      border-radius: 30px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .control-label {
      font-size: 11px;
      color: var(--text-sub);
      font-weight: 700;
    }

    .palette {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    /* パレット背景と被らない見やすいリング付きボタン */
    .color-btn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid #ffffff33;
      cursor: pointer;
      transition: transform 0.15s;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.5);
    }

    .color-btn:hover {
      transform: scale(1.2);
    }

    .color-btn.selected {
      border-color: #fff;
      transform: scale(1.25);
      box-shadow: 0 0 0 2px var(--accent);
    }

    .picker {
      width: 26px;
      height: 26px;
      border: none;
      background: none;
      cursor: pointer;
    }

    .btn {
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #334155;
      color: var(--text);
      cursor: pointer;
    }

    .btn:hover {
      background: #475569;
    }

    .btn-save {
      background: #10b981;
      border-color: #059669;
    }

    .btn-save:hover {
      background: #059669;
    }

    /* 描画メイン領域 */
    main {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    #map-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: var(--bg-dark); /* 初期背景色はダークネイビー */
      transition: background-color 0.25s;
    }

    svg {
      width: 85%;
      height: 85%;
      max-width: 900px;
      max-height: 700px;
    }

    /* 着色対象のCSS（初期色は灰色） */
    svg path, svg polygon, svg rect, svg circle {
      cursor: pointer;
      transition: opacity 0.15s ease;
    }

    svg path:hover, svg polygon:hover, svg rect:hover, svg circle:hover {
      opacity: 0.75 !important;
    }

    /* ツールチップ */
    #tooltip {
      position: absolute;
      display: none;
      background: rgba(15, 23, 42, 0.95);
      color: #ffffff;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      pointer-events: none;
      z-index: 1000;
      border: 1px solid var(--border);
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <!-- ==========================================
       画面1: ホーム＆地図選択画面
  =========================================== -->
  <div id="screen-home" class="screen active">
    <div class="home-container">
      <div class="home-title">都道府県・市区町村 ぬりえツール</div>
      <div class="home-subtitle">色を選んでクリックするだけ！作成した地図は画像で保存できます</div>

      <div class="map-grid">
        <!-- 日本全国カテゴリ -->
        <div class="category-group">
          <div class="category-title">🗺️ 全国マップ</div>
          <div class="card-list">
            <div class="map-card" onclick="startApp('japan', '日本全国（都道府県）')">
              <span>日本全国 (47都道府県)</span>
              <span style="color:var(--accent);">→</span>
            </div>
          </div>
        </div>

        <!-- 近畿エリアカテゴリ -->
        <div class="category-group">
          <div class="category-title">📍 近畿エリア（詳細）</div>
          <div class="card-list">
            <div class="map-card" onclick="startApp('kyoto', '京都府（市区町村詳細）')">
              <span>京都府 (全市区町村)</span>
              <span style="color:var(--accent);">→</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ==========================================
       画面2: ぬりえメイン画面
  =========================================== -->
  <div id="screen-app" class="screen">
    <header>
      <div class="header-left">
        <button class="back-btn" onclick="goHome()">← 地図選択に戻る</button>
        <div class="current-map-title" id="display-map-title">日本全国</div>
      </div>
      <div>
        <label style="font-size: 12px; cursor: pointer; color: var(--text-sub); margin-right: 10px;">
          <input type="checkbox" id="transparent-bg"> 透過保存
        </label>
        <button class="btn" onclick="resetMapColors()">色全消去</button>
        <button class="btn btn-save" onclick="saveAsImage()">PNG保存</button>
      </div>
    </header>

    <main>
      <div id="map-wrapper">
        <!-- SVG地図データ挿入箇所 -->
      </div>

      <!-- 下部コントロールバー -->
      <div class="controls-bar">
        <!-- 塗り色 -->
        <div class="control-group">
          <span class="control-label">塗り色</span>
          <div class="palette">
            <div class="color-btn selected" style="background-color: #ef4444;" onclick="selectPaintColor('#ef4444', this)"></div>
            <div class="color-btn" style="background-color: #f59e0b;" onclick="selectPaintColor('#f59e0b', this)"></div>
            <div class="color-btn" style="background-color: #10b981;" onclick="selectPaintColor('#10b981', this)"></div>
            <div class="color-btn" style="background-color: #3b82f6;" onclick="selectPaintColor('#3b82f6', this)"></div>
            <div class="color-btn" style="background-color: #8b5cf6;" onclick="selectPaintColor('#8b5cf6', this)"></div>
            <div class="color-btn" style="background-color: #ec4899;" onclick="selectPaintColor('#ec4899', this)"></div>
            <input type="color" class="picker" value="#ef4444" onchange="selectPaintColor(this.value, null)" title="自由選択">
          </div>
        </div>

        <div style="width: 1px; height: 20px; background: var(--border);"></div>

        <!-- 背景色 -->
        <div class="control-group">
          <span class="control-label">背景色</span>
          <div class="palette">
            <div class="color-btn" style="background-color: #0f172a;" onclick="setCanvasBg('#0f172a')"></div>
            <div class="color-btn" style="background-color: #ffffff;" onclick="setCanvasBg('#ffffff')"></div>
            <div class="color-btn" style="background-color: #f1f5f9;" onclick="setCanvasBg('#f1f5f9')"></div>
            <div class="color-btn" style="background-color: #e0f2fe;" onclick="setCanvasBg('#e0f2fe')"></div>
            <div class="color-btn" style="background-color: #fce7f3;" onclick="setCanvasBg('#fce7f3')"></div>
            <input type="color" class="picker" value="#0f172a" onchange="setCanvasBg(this.value)" title="自由選択">
          </div>
        </div>
      </div>
    </main>
  </div>

  <div id="tooltip"></div>

  <script>
    let currentColor = '#ef4444';
    let currentMapMode = 'japan';

    // 都道府県名 日本語変換マッピング
    const japanPrefMap = {
      "Hokkaido": "北海道", "Aomori": "青森県", "Iwate": "岩手県", "Miyagi": "宮城県",
      "Akita": "秋田県", "Yamagata": "山形県", "Fukushima": "福島県", "Ibaraki": "茨城県",
      "Tochigi": "栃木県", "Gunma": "群馬県", "Saitama": "埼玉県", "Chiba": "千葉県",
      "Tokyo": "東京都", "Kanagawa": "神奈川県", "Niigata": "新潟県", "Toyama": "富山県",
      "Ishikawa": "石川県", "Fukui": "福井県", "Yamanashi": "山梨県", "Nagano": "長野県",
      "Gifu": "岐阜県", "Shizuoka": "静岡県", "Aichi": "愛知県", "Mie": "三重県",
      "Shiga": "滋賀県", "Kyoto": "京都府", "Osaka": "大阪府", "Hyogo": "兵庫県",
      "Nara": "奈良県", "Wakayama": "和歌山県", "Tottori": "鳥取県", "Shimane": "島根県",
      "Okayama": "岡山県", "Hiroshima": "広島県", "Yamaguchi": "山口県", "Tokushima": "徳島県",
      "Kagawa": "香川県", "Ehime": "愛媛県", "Kochi": "高知県", "Fukuoka": "福岡県",
      "Saga": "佐賀県", "Nagasaki": "長崎県", "Kumamoto": "熊本県", "Oita": "大分県",
      "Miyazaki": "宮崎県", "Kagoshima": "鹿児島県", "Okinawa": "沖縄県"
    };

    // 京都府 JISコード変換マッピング（飛地・南部含む）
    const kyotoCityMap = {
      "JP26101": "京都市北区", "JP26102": "京都市上京区", "JP26103": "京都市左京区",
      "JP26104": "京都市中京区", "JP26105": "京都市東山区", "JP26106": "京都市下京区",
      "JP26107": "京都市南区", "JP26108": "京都市右京区", "JP26109": "京都市伏見区",
      "JP26110": "京都市山科区", "JP26111": "京都市西京区", "JP26201": "福知山市",
      "JP26202": "舞鶴市", "JP26203": "綾部市", "JP26204": "宇治市",
      "JP26205": "宮津市", "JP26206": "城陽市", "JP26207": "向日市",
      "JP26208": "長岡京市", "JP26209": "八幡市", "JP26210": "京田辺市",
      "JP26211": "京丹後市", "JP26212": "南丹市", "JP26213": "木津川市",
      "JP26214": "大山崎町", "JP26303": "久御山町", "JP26322": "井手町",
      "JP26343": "宇治田原町", "JP26364": "笠置町", "JP26365": "和束町",
      "JP26366": "精華町", "JP26367": "南山城村", "JP26407": "京丹波町",
      "JP26463": "伊根町", "JP26465": "与謝野町"
    };

    const wrapper = document.getElementById('map-wrapper');
    const tooltip = document.getElementById('tooltip');

    // 画面遷移コントロール
    function startApp(mode, title) {
      currentMapMode = mode;
      document.getElementById('display-map-title').innerText = title;
      document.getElementById('screen-home').classList.remove('active');
      document.getElementById('screen-app').classList.add('active');
      loadMapSvg(mode);
    }

    function goHome() {
      document.getElementById('screen-app').classList.remove('active');
      document.getElementById('screen-home').classList.add('active');
    }

    function selectPaintColor(color, el) {
      currentColor = color;
      document.querySelectorAll('.controls-bar .control-group:first-child .color-btn').forEach(btn => btn.classList.remove('selected'));
      if (el) el.classList.add('selected');
    }

    function setCanvasBg(color) {
      wrapper.style.backgroundColor = color;
    }

    // SVGファイルの取得
    function loadMapSvg(mode) {
      const fileName = (mode === 'japan') ? 'japan-map.svg' : 'kyoto-map.svg';

      fetch(fileName)
        .then(res => res.text())
        .then(svgText => {
          wrapper.innerHTML = svgText;
          setupMapEvents();
        })
        .catch(() => {
          wrapper.innerHTML = `<p style="color:#ef4444;">${fileName} の読み込みに失敗しました。</p>`;
        });
    }

    // イベント設定（一括グループ着色 ＆ 灰色へ戻す処理）
    function setupMapEvents() {
      const svg = wrapper.querySelector('svg');
      if (!svg) return;

      const elements = svg.querySelectorAll('path, polygon, rect, circle');

      elements.forEach(el => {
        const parentG = el.closest('g');
        
        // グループ識別用のID / コードを取得（宮津市・島などの飛地一括用）
        const groupId = (parentG && parentG.id) ? parentG.id : (el.id || el.getAttribute('data-code'));

        // 日本語名称の判定
        let rawName = el.getAttribute('name') || el.getAttribute('title') || el.getAttribute('data-name') ||
                      (parentG ? (parentG.getAttribute('name') || parentG.getAttribute('title') || parentG.getAttribute('id')) : null);

        let regionName = rawName;

        if (currentMapMode === 'japan' && rawName) {
          const cleanName = rawName.split('/')[0].trim();
          regionName = japanPrefMap[cleanName] || japanPrefMap[rawName] || rawName;
        }

        if (currentMapMode === 'kyoto') {
          if (groupId && kyotoCityMap[groupId]) {
            regionName = kyotoCityMap[groupId];
          } else if (rawName && kyotoCityMap[rawName]) {
            regionName = kyotoCityMap[rawName];
          }
        }

        // 初期色の灰色を設定
        if (!el.getAttribute('fill')) {
          el.setAttribute('fill', 'var(--map-default-fill)');
          el.style.fill = 'var(--map-default-fill)';
        }

        // クリック時：着色 / 再クリックで「灰色（初期状態）」に戻す
        el.addEventListener('click', (e) => {
          e.stopPropagation();

          const isPainted = el.getAttribute('data-painted') === 'true';
          const currentPaintedColor = el.getAttribute('data-color');

          // 同じ色をクリックした場合は解除（灰色に戻す）
          const nextColor = (isPainted && currentPaintedColor === currentColor) ? null : currentColor;

          // 同一ID/コードを持つ全てのパーツ（島・飛地）を検索して一括適用
          if (groupId) {
            const sameGroup = svg.querySelectorAll(`[id="${groupId}"], [data-code="${groupId}"], g[id="${groupId}"] path`);
            if (sameGroup.length > 0) {
              sameGroup.forEach(target => applyColor(target, nextColor));
              return;
            }
          }
          applyColor(el, nextColor);
        });

        // ツールチップ
        if (regionName) {
          el.addEventListener('mouseenter', () => {
            tooltip.innerText = regionName;
            tooltip.style.display = 'block';
          });
          el.addEventListener('mousemove', (e) => {
            tooltip.style.left = (e.pageX + 12) + 'px';
            tooltip.style.top = (e.pageY + 12) + 'px';
          });
          el.addEventListener('mouseleave', () => {
            tooltip.style.display = 'none';
          });
        }
      });
    }

    // 色適用処理（nullの場合は初期の灰色に戻す）
    function applyColor(element, color) {
      if (!color) {
        element.style.fill = 'var(--map-default-fill)';
        element.setAttribute('fill', 'var(--map-default-fill)');
        element.removeAttribute('data-painted');
        element.removeAttribute('data-color');
      } else {
        element.style.fill = color;
        element.setAttribute('fill', color);
        element.setAttribute('data-painted', 'true');
        element.setAttribute('data-color', color);
      }
    }

    // 全消去（初期の灰色へ）
    function resetMapColors() {
      const svg = wrapper.querySelector('svg');
      if (!svg) return;
      svg.querySelectorAll('path, polygon, rect, circle').forEach(el => {
        applyColor(el, null);
      });
    }

    // PNG画像として保存
    function saveAsImage() {
      const svg = wrapper.querySelector('svg');
      if (!svg) return;

      const isTransparent = document.getElementById('transparent-bg').checked;
      const svgData = new XMLSerializer().serializeToString(svg);
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      const img = new Image();

      const viewBox = svg.viewBox.baseVal;
      const width = viewBox.width || svg.clientWidth || 800;
      const height = viewBox.height || svg.clientHeight || 600;

      canvas.width = width * 2;
      canvas.height = height * 2;

      const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(svgBlob);

      img.onload = () => {
        if (!isTransparent) {
          ctx.fillStyle = wrapper.style.backgroundColor || '#0f172a';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);

        const a = document.createElement('a');
        a.download = `${currentMapMode}_ぬりえ.png`;
        a.href = canvas.toDataURL('image/png');
        a.click();
      };

      img.src = url;
    }
  </script>
</body>
</html>
