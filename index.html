<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>都道府県・市区町村 ぬりえ Studio Pro</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Noto+Sans+JP:wght@500;700;800&display=swap');

    :root {
      --bg-main: #090d16;
      --panel-bg: rgba(20, 27, 45, 0.75);
      --panel-border: rgba(255, 255, 255, 0.08);
      --panel-border-active: rgba(56, 189, 248, 0.4);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent-cyan: #38bdf8;
      --accent-indigo: #818cf8;
      --grad-accent: linear-gradient(135deg, #38bdf8 0%, #6366f1 100%);
      --shadow-glow: 0 0 25px rgba(56, 189, 248, 0.15);
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans JP', -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      background-color: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .screen {
      display: none;
      width: 100%;
      height: 100%;
      flex-direction: column;
      animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .screen.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }

    /* ----------------------------------
       画面1: ホーム＆地図選択
    ---------------------------------- */
    .home-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px;
      overflow-y: auto;
      background: 
        radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.12) 0%, transparent 60%),
        radial-gradient(circle at 80% 100%, rgba(99, 102, 241, 0.08) 0%, transparent 50%),
        var(--bg-main);
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 16px;
      border-radius: 99px;
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.25);
      color: var(--accent-cyan);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    .home-title {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin: 0 0 12px 0;
      background: var(--grad-accent);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .home-subtitle {
      color: var(--text-sub);
      font-size: 15px;
      max-width: 480px;
      line-height: 1.6;
      margin-bottom: 48px;
      text-align: center;
    }

    .map-grid {
      display: flex;
      flex-direction: column;
      gap: 24px;
      width: 100%;
      max-width: 720px;
    }

    .category-group {
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .category-title {
      font-size: 12px;
      font-weight: 800;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 14px;
    }

    .map-card {
      background: rgba(255, 255, 255, 0.03);
      padding: 18px 20px;
      border-radius: 14px;
      border: 1px solid var(--panel-border);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      font-size: 15px;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .map-card:hover {
      border-color: var(--panel-border-active);
      background: rgba(56, 189, 248, 0.06);
      transform: translateY(-2px);
      box-shadow: var(--shadow-glow);
    }

    .map-card-arrow {
      color: var(--text-sub);
      font-size: 18px;
      transition: transform 0.2s, color 0.2s;
    }

    .map-card:hover .map-card-arrow {
      color: var(--accent-cyan);
      transform: translateX(4px);
    }

    /* ----------------------------------
       画面2: ぬりえキャンバス
    ---------------------------------- */
    header {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--panel-border);
      padding: 14px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .back-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--panel-border);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      transition: all 0.2s;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .current-map-title {
      font-weight: 800;
      font-size: 18px;
      letter-spacing: -0.3px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .checkbox-label {
      font-size: 13px;
      cursor: pointer;
      color: var(--text-sub);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-right: 8px;
    }

    .btn {
      padding: 9px 18px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 10px;
      border: 1px solid var(--panel-border);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .btn-save {
      background: var(--grad-accent);
      border: none;
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
    }

    .btn-save:hover {
      opacity: 0.9;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4);
    }

    main {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    #map-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: var(--bg-main);
      transition: background-color 0.3s ease;
    }

    svg {
      width: 85%;
      height: 85%;
      max-width: 950px;
      max-height: 720px;
      filter: drop-shadow(0 15px 35px rgba(0,0,0,0.4));
    }

    svg path, svg polygon, svg rect, svg circle {
      cursor: pointer;
      transition: opacity 0.15s ease, fill 0.25s ease, stroke 0.2s ease;
      stroke: rgba(255, 255, 255, 0.2);
      stroke-width: 0.6;
    }

    svg path:hover, svg polygon:hover, svg rect:hover, svg circle:hover {
      opacity: 0.85 !important;
      stroke: #ffffff;
      stroke-width: 1.2;
    }

    /* Floating Controls Bar */
    .controls-bar {
      display: flex;
      align-items: center;
      gap: 24px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 12px 28px;
      border-radius: 99px;
      border: 1px solid var(--panel-border);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .control-label {
      font-size: 11px;
      color: var(--text-sub);
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .palette {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .color-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.15);
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.2s;
      box-shadow: 0 3px 8px rgba(0,0,0,0.3);
    }

    .color-btn:hover {
      transform: scale(1.18);
    }

    .color-btn.selected {
      border-color: #ffffff;
      transform: scale(1.25);
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
    }

    .picker-wrapper {
      position: relative;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.2);
      cursor: pointer;
      background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red);
    }

    .picker {
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      opacity: 0;
      cursor: pointer;
    }

    .divider {
      width: 1px;
      height: 24px;
      background: var(--panel-border);
    }

    #tooltip {
      position: fixed;
      display: none;
      opacity: 0;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      pointer-events: none;
      z-index: 9999;
      border: 1px solid var(--panel-border);
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
      transition: opacity 0.15s ease;
    }
  </style>
</head>

        </div>

              <input type="color" class="picker" value="#090d16" onchange="setCanvasBg(this.value)">

          </div>
        </div>
      </div>
    </main>

        "JP27222": "羽曳野市", "JP27223": "門真市", "JP27224": "摂津市", "JP27225": "高石市",
        "JP27226": "藤井寺市", "JP27227": "東大阪市", "JP27228": "泉南市", "JP27229": "四條畷市",
        "JP27230": "交野市", "JP27231": "大阪狭山市", "JP27232": "阪南市", "JP27301": "島本町",
        "JP27321": "豊能町", "JP27322": "能勢町", "JP27341": "忠岡町", "JP27361": "熊取町",
        "JP27362": "田尻町", "JP27366": "岬町", "JP27381": "太子町", "JP27382": "河南町", "JP27383": "千早赤阪村"
      }
    };

    const wrapper = document.getElementById('map-wrapper');
    const tooltip = document.getElementById('tooltip');

    function hideTooltip() {
      tooltip.style.opacity = '0';
      tooltip.style.display = 'none';
      tooltip.innerText = '';
    }

    function startApp(mode, fileName, title) {
      hideTooltip();
      currentMapMode = mode;
      document.getElementById('display-map-title').innerText = title;
      document.getElementById('screen-home').classList.remove('active');
      document.getElementById('screen-app').classList.add('active');
      loadMapSvg(fileName);
    }

    function goHome() {
      hideTooltip();
      document.getElementById('screen-app').classList.remove('active');
      document.getElementById('screen-home').classList.add('active');
    }

    function selectPaintColor(color, el) {
      currentColor = color;
      document.querySelectorAll('.controls-bar .control-group:first-child .color-btn').forEach(btn => btn.classList.remove('selected'));
      if (el) el.classList.add('selected');
    }

    function setCanvasBg(color) {
      wrapper.style.backgroundColor = color;
    }

    function loadMapSvg(fileName) {
      fetch(fileName)
        .then(res => res.text())
        .then(svgText => {
          wrapper.innerHTML = svgText;
          setupMapEvents();
        })
        .catch(() => {
          wrapper.innerHTML = `<p style="color:#ef4444; font-weight:700;">${fileName} の読み込みに失敗しました。</p>`;
        });
    }

    function setupMapEvents() {
      const svg = wrapper.querySelector('svg');
      if (!svg) return;

      const elements = svg.querySelectorAll('path, polygon, rect, circle');
      const currentCityMap = cityDataMaps[currentMapMode] || {};

      elements.forEach(el => {
        const parentG = el.closest('g');
        const rawId = el.id || (parentG ? parentG.id : null) || el.getAttribute('data-code');

        let rawName = el.getAttribute('name') || el.getAttribute('title') || el.getAttribute('data-name') ||
                      (parentG ? (parentG.getAttribute('name') || parentG.getAttribute('title') || parentG.getAttribute('id')) : null);

        let regionName = rawName;

        if (currentMapMode === 'japan' && rawName) {
          const cleanName = rawName.split('/')[0].trim();
          regionName = japanPrefMap[cleanName] || japanPrefMap[rawName] || rawName;
        } else {
          if (rawId && currentCityMap[rawId]) {
            regionName = currentCityMap[rawId];
          } else if (rawName && currentCityMap[rawName]) {
            regionName = currentCityMap[rawName];
          }
        }

        const computedStyle = window.getComputedStyle(el);
        const originalFill = el.getAttribute('fill') || computedStyle.fill || '#1e293b';
        el.setAttribute('data-default-fill', originalFill);

        el.addEventListener('click', (e) => {
          e.stopPropagation();
          hideTooltip();

          const isPainted = el.getAttribute('data-painted') === 'true';
          const currentPaintedColor = el.getAttribute('data-color');
          const nextColor = (isPainted && currentPaintedColor === currentColor) ? null : currentColor;

          // 島・飛び地・関連要素の完全連動一括更新
          if (rawId) {
            const sameGroup = svg.querySelectorAll(`[id="${rawId}"], [data-code="${rawId}"], g[id="${rawId}"] path, g[id="${rawId}"] polygon, g[id="${rawId}"] rect`);
            if (sameGroup.length > 0) {
              sameGroup.forEach(target => applyColor(target, nextColor));
              return;
            }
          }
          applyColor(el, nextColor);
        });

        if (regionName) {
          el.addEventListener('mouseenter', (e) => {
            tooltip.innerText = regionName;
            tooltip.style.display = 'block';
            tooltip.style.opacity = '1';
            tooltip.style.left = (e.clientX + 14) + 'px';
            tooltip.style.top = (e.clientY + 14) + 'px';
          });
          
          el.addEventListener('mousemove', (e) => {
            tooltip.style.left = (e.clientX + 14) + 'px';
            tooltip.style.top = (e.clientY + 14) + 'px';
          });
          
          el.addEventListener('mouseleave', hideTooltip);
        }
      });
    }

    function applyColor(element, color) {
      if (!color) {
        const defaultColor = element.getAttribute('data-default-fill') || '#1e293b';
        element.style.fill = defaultColor;
        element.setAttribute('fill', defaultColor);
        element.removeAttribute('data-painted');
        element.removeAttribute('data-color');
      } else {
        element.style.fill = color;
        element.setAttribute('fill', color);
        element.setAttribute('data-painted', 'true');
        element.setAttribute('data-color', color);
      }
    }

    function resetMapColors() {
      hideTooltip();
      const svg = wrapper.querySelector('svg');
      if (!svg) return;
      svg.querySelectorAll('path, polygon, rect, circle').forEach(el => {
        applyColor(el, null);
      });
    }

    function saveAsImage() {
      hideTooltip();
      const svg = wrapper.querySelector('svg');
      if (!svg) return;

      const isTransparent = document.getElementById('transparent-bg').checked;
      const svgData = new XMLSerializer().serializeToString(svg);
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      const img = new Image();

      const viewBox = svg.viewBox.baseVal;
      const width = viewBox.width || svg.clientWidth || 800;
      const height = viewBox.height || svg.clientHeight || 600;

      canvas.width = width * 2;
      canvas.height = height * 2;

      const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(svgBlob);

      img.onload = () => {
        if (!isTransparent) {
          ctx.fillStyle = wrapper.style.backgroundColor || '#090d16';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);

        const a = document.createElement('a');
        a.download = `${currentMapMode}_塗り絵.png`;
        a.href = canvas.toDataURL('image/png');
        a.click();
      };

      img.src = url;
    }
  </script>
</body>
