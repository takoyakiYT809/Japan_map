<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>地図ぬりえ Studio Pro</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --panel-bg: rgba(30, 41, 59, 0.85);
      --panel-border: rgba(255, 255, 255, 0.1);
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background-color: var(--bg-dark);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 上部ヘッダー・ツールバー */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--panel-border);
      z-index: 10;
    }

    .logo {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .map-tabs {
      display: flex;
      gap: 4px;
      background: rgba(0, 0, 0, 0.3);
      padding: 4px;
      border-radius: 8px;
    }

    .tab-btn {
      padding: 6px 16px;
      border: none;
      background: transparent;
      color: var(--text-sub);
      font-size: 13px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #0f172a;
    }

    /* メイン作業エリア */
    main {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      cursor: grab;
    }

    main:active {
      cursor: grabbing;
    }

    #map-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      transform-origin: 0 0;
      transition: background-color 0.2s ease;
    }

    svg {
      width: 80%;
      height: 80%;
      max-width: 1000px;
      max-height: 800px;
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));
    }

    svg path, svg polygon, svg rect, svg circle {
      cursor: pointer;
      transition: fill 0.15s ease, stroke-width 0.15s ease;
    }

    svg path:hover, svg polygon:hover, svg g:hover path {
      opacity: 0.8;
      stroke: #38bdf8 !important;
      stroke-width: 2px !important;
    }

    /* フローティングコントロールパネル */
    .controls-panel {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 16px;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      padding: 12px 20px;
      border-radius: 16px;
      border: 1px solid var(--panel-border);
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
      z-index: 10;
      align-items: center;
    }

    .panel-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .panel-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-sub);
      letter-spacing: 0.5px;
    }

    .color-palette {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .color-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.15s ease;
      position: relative;
    }

    .color-btn.eraser {
      background: linear-gradient(45deg, #ccc 25%, transparent 25%), 
                  linear-gradient(-45deg, #ccc 25%, transparent 25%), 
                  linear-gradient(45deg, transparent 75%, #ccc 75%), 
                  linear-gradient(-45deg, transparent 75%, #ccc 75%);
      background-size: 8px 8px;
      background-position: 0 0, 0 4px, 4px -4px, -4px 0px;
      background-color: #fff;
    }

    .color-btn:hover {
      transform: scale(1.15);
    }

    .color-btn.selected {
      border-color: #fff;
      transform: scale(1.2);
      box-shadow: 0 0 0 2px var(--accent);
    }

    .picker-input {
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      background: transparent;
    }

    .divider {
      width: 1px;
      height: 36px;
      background: var(--panel-border);
    }

    /* ズームコントロール */
    .zoom-controls {
      position: absolute;
      right: 24px;
      bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 10;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: 1px solid var(--panel-border);
      background: var(--panel-bg);
      color: var(--text);
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      backdrop-filter: blur(12px);
      display: flex;
      justify-content: center;
      align-items: center;
      transition: 0.2s;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .btn-action {
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 8px;
      border: 1px solid var(--panel-border);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-action:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .btn-save {
      background: var(--accent);
      color: #0f172a;
      border: none;
    }

    .btn-save:hover {
      background: #7dd3fc;
    }

    /* 透過トグル */
    .checkbox-label {
      font-size: 11px;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    /* ツールチップ */
    #tooltip {
      position: absolute;
      display: none;
      background: rgba(15, 23, 42, 0.95);
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      pointer-events: none;
      z-index: 1000;
      border: 1px solid var(--panel-border);
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">地図ぬりえ Studio</div>
    <div class="map-tabs">
      <button class="tab-btn active" onclick="switchMap('japan')">日本全国</button>
      <button class="tab-btn" onclick="switchMap('kyoto')">京都府（詳細）</button>
    </div>
    <div style="display: flex; gap: 8px; align-items: center;">
      <label class="checkbox-label">
        <input type="checkbox" id="transparent-bg"> 透過保存
      </label>
      <button class="btn-action" onclick="resetMapColors()">色全消去</button>
      <button class="btn-action btn-save" onclick="saveAsImage()">PNG保存</button>
    </div>
  </header>

  <main id="viewport">
    <div id="map-container">
      <!-- SVG読み込みエリア -->
    </div>
  </main>

  <!-- 右下 ズームコントローラー -->
  <div class="zoom-controls">
    <button class="icon-btn" onclick="zoom(1.2)">＋</button>
    <button class="icon-btn" onclick="zoom(0.8)">ー</button>
    <button class="icon-btn" onclick="resetZoom()" title="表示位置リセット">⟲</button>
  </div>

  <!-- 下部 パレットコントロール -->
  <div class="controls-panel">
    <div class="panel-group">
      <span class="panel-label">塗りつぶし / 消去</span>
      <div class="color-palette">
        <div class="color-btn selected" style="background-color: #ef4444;" onclick="selectColor('#ef4444', this)"></div>
        <div class="color-btn" style="background-color: #f59e0b;" onclick="selectColor('#f59e0b', this)"></div>
        <div class="color-btn" style="background-color: #10b981;" onclick="selectColor('#10b981', this)"></div>
        <div class="color-btn" style="background-color: #3b82f6;" onclick="selectColor('#3b82f6', this)"></div>
        <div class="color-btn" style="background-color: #8b5cf6;" onclick="selectColor('#8b5cf6', this)"></div>
        <!-- 個別消しゴムボタン -->
        <div class="color-btn eraser" onclick="selectColor('none', this)" title="色消しゴム"></div>
        <input type="color" class="picker-input" value="#ef4444" onchange="selectColor(this.value, null)">
      </div>
    </div>

    <div class="divider"></div>

    <div class="panel-group">
      <span class="panel-label">キャンバス背景</span>
      <div class="color-palette">
        <div class="color-btn" style="background-color: #ffffff;" onclick="setCanvasBg('#ffffff')"></div>
        <div class="color-btn" style="background-color: #f1f5f9;" onclick="setCanvasBg('#f1f5f9')"></div>
        <div class="color-btn" style="background-color: #0f172a;" onclick="setCanvasBg('#0f172a')"></div>
        <input type="color" class="picker-input" value="#ffffff" onchange="setCanvasBg(this.value)">
      </div>
    </div>
  </div>

  <div id="tooltip"></div>

  <script>
    let currentColor = '#ef4444';
    let currentMapMode = 'japan';
    
    // Pan & Zoom 変数
    let scale = 1;
    let pointX = 0;
    let pointY = 0;
    let startX = 0;
    let startY = 0;
    let isDragging = false;

    const kyotoCityMap = {
      "JP26101": "京都市北区", "JP26102": "京都市上京区", "JP26103": "京都市左京区",
      "JP26104": "京都市中京区", "JP26105": "京都市東山区", "JP26106": "京都市下京区",
      "JP26107": "京都市南区", "JP26108": "京都市右京区", "JP26109": "京都市伏見区",
      "JP26110": "京都市山科区", "JP26111": "京都市西京区", "JP26201": "福知山市",
      "JP26202": "舞鶴市", "JP26203": "綾部市", "JP26204": "宇治市",
      "JP26205": "宮津市", "JP26206": "城陽市", "JP26207": "向日市",
      "JP26208": "長岡京市", "JP26209": "八幡市", "JP26210": "京田辺市",
      "JP26211": "京丹後市", "JP26212": "南丹市", "JP26213": "木津川市",
      "JP26214": "大山崎町", "JP26303": "久御山町", "JP26322": "井手町",
      "JP26343": "宇治田原町", "JP26364": "笠置町", "JP26365": "和束町",
      "JP26366": "精華町", "JP26367": "南山城村", "JP26407": "京丹波町",
      "JP26463": "伊根町", "JP26465": "与謝野町"
    };

    const mapContainer = document.getElementById('map-container');
    const viewport = document.getElementById('viewport');
    const tooltip = document.getElementById('tooltip');

    // カラー選択
    function selectColor(color, el) {
      currentColor = color;
      document.querySelectorAll('.controls-panel .color-btn').forEach(btn => btn.classList.remove('selected'));
      if (el) el.classList.add('selected');
    }

    // キャンバス背景色設定
    function setCanvasBg(color) {
      mapContainer.style.backgroundColor = color;
    }

    // 地図の切り替え
    function switchMap(mode) {
      currentMapMode = mode;
      resetZoom();

      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (mode === 'japan') document.querySelectorAll('.tab-btn')[0].classList.add('active');
      if (mode === 'kyoto') document.querySelectorAll('.tab-btn')[1].classList.add('active');

      const fileName = (mode === 'japan') ? 'japan-map.svg' : 'kyoto-map.svg';

      fetch(fileName)
        .then(res => res.text())
        .then(svgText => {
          mapContainer.innerHTML = svgText;
          setupEvents();
        })
        .catch(() => {
          mapContainer.innerHTML = `<p style="color:#ef4444;">${fileName} の読み込みに失敗しました。</p>`;
        });
    }

    // 地図イベントの紐付け（飛地・グループ一括着色に対応）
    function setupEvents() {
      const svg = mapContainer.querySelector('svg');
      if (!svg) return;

      const elements = svg.querySelectorAll('path, polygon, rect, circle');

      elements.forEach(el => {
        // JISコードまたはIDを取得して統合グループを判定
        const parentG = el.closest('g');
        const entityId = (parentG && parentG.id) ? parentG.id : (el.id || el.getAttribute('data-code'));
        
        // 表示名の判定
        let regionName = el.getAttribute('name') || el.getAttribute('title') || (parentG ? parentG.getAttribute('name') : null);
        if (currentMapMode === 'kyoto' && entityId) {
          if (kyotoCityMap[entityId]) regionName = kyotoCityMap[entityId];
        }

        // クリック時：同じID/コードを持つ領域をすべて塗る（飛地・多角形対応）
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          if (isDragging) return;

          if (entityId) {
            // 同一IDを持つ要素を一括着色（宮津市・島などのバラバラ問題を解決）
            const sameGroup = svg.querySelectorAll(`[id="${entityId}"], [data-code="${entityId}"], g[id="${entityId}"] path`);
            if (sameGroup.length > 0) {
              sameGroup.forEach(target => applyColor(target, currentColor));
              return;
            }
          }
          applyColor(el, currentColor);
        });

        // ツールチップ表示
        if (regionName) {
          el.addEventListener('mouseenter', () => {
            tooltip.innerText = regionName;
            tooltip.style.display = 'block';
          });
          el.addEventListener('mousemove', (e) => {
            tooltip.style.left = (e.pageX + 15) + 'px';
            tooltip.style.top = (e.pageY + 15) + 'px';
          });
          el.addEventListener('mouseleave', () => {
            tooltip.style.display = 'none';
          });
        }
      });
    }

    // 色適用（"none"の場合は消去）
    function applyColor(element, color) {
      if (color === 'none') {
        element.style.fill = '';
        element.removeAttribute('fill');
      } else {
        element.style.fill = color;
        element.setAttribute('fill', color);
      }
    }

    // 色全クリア
    function resetMapColors() {
      const svg = mapContainer.querySelector('svg');
      if (!svg) return;
      svg.querySelectorAll('path, polygon, rect, circle').forEach(el => {
        el.style.fill = '';
        el.removeAttribute('fill');
      });
    }

    // 拡大・縮小・パン移動処理
    function setTransform() {
      mapContainer.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
    }

    function zoom(factor) {
      scale *= factor;
      scale = Math.min(Math.max(0.5, scale), 5); // 0.5倍〜5倍制限
      setTransform();
    }

    function resetZoom() {
      scale = 1;
      pointX = 0;
      pointY = 0;
      setTransform();
    }

    // マウスドラッグ移動
    viewport.addEventListener('mousedown', (e) => {
      if (e.target.tagName === 'path' || e.target.tagName === 'polygon') return;
      isDragging = true;
      startX = e.clientX - pointX;
      startY = e.clientY - pointY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      pointX = e.clientX - startX;
      pointY = e.clientY - startY;
      setTransform();
    });

    window.addEventListener('mouseup', () => {
      isDragging = false;
    });

    // ホイールズーム
    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      const xs = (e.clientX - pointX) / scale;
      const ys = (e.clientY - pointY) / scale;
      const delta = -e.deltaY;
      (delta > 0) ? scale *= 1.1 : scale /= 1.1;
      scale = Math.min(Math.max(0.5, scale), 5);
      pointX = e.clientX - xs * scale;
      pointY = e.clientY - ys * scale;
      setTransform();
    });

    // 画像保存（縦横比歪み防止＆透過対応）
    function saveAsImage() {
      const svg = mapContainer.querySelector('svg');
      if (!svg) return;

      const isTransparent = document.getElementById('transparent-bg').checked;
      const svgData = new XMLSerializer().serializeToString(svg);
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      const img = new Image();

      // SVG本来のアスペクト比を計算して解像度を設定
      const viewBox = svg.viewBox.baseVal;
      const width = viewBox.width || svg.clientWidth || 800;
      const height = viewBox.height || svg.clientHeight || 600;

      // 高解像度保存（2倍サイズ）
      canvas.width = width * 2;
      canvas.height = height * 2;

      const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(svgBlob);

      img.onload = () => {
        // 透過オプションの判定
        if (!isTransparent) {
          ctx.fillStyle = mapContainer.style.backgroundColor || '#ffffff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        // アスペクト比を維持して描画
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);

        const a = document.createElement('a');
        a.download = `${currentMapMode}_塗図.png`;
        a.href = canvas.toDataURL('image/png');
        a.click();
      };

      img.src = url;
    }

    // 初期起動
    switchMap('japan');
  </script>
</body>
</html>
